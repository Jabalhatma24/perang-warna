<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Perang Warna</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Arena Perang Warna 7 Wilayah Nusantara"></canvas>

  <div id="start" hidden>
    <h1>PERANG WARNA</h1>
    <p>7 Wilayah Nusantara</p>
    <button id="startBtn" type="button">MULAI</button>
    <button id="soundBtn" type="button" aria-pressed="true" aria-label="Mulai dengan suara">🔊 Suara menyala</button>
  </div>

  <div id="audioPanel" hidden>
    <div class="panel-title">
      <strong>Audio</strong>
      <button id="panelClose" type="button" aria-label="Tutup panel audio">✕</button>
    </div>
    <label>Master <input id="volMaster" type="range" min="0" max="1" step="0.01"></label>
    <label>SFX <input id="volSfx" type="range" min="0" max="1" step="0.01"></label>
    <label>Musik <input id="volMusic" type="range" min="0" max="1" step="0.01"></label>
    <label class="check"><input id="musicToggle" type="checkbox"> Musik menyala</label>
    <button id="talkBtn" type="button" aria-pressed="false">Mode Bicara</button>
  </div>

  <div id="takeover" hidden>
    <p>Host lain sedang aktif. Layar ini hanya menonton.</p>
    <button id="takeoverBtn" type="button">Ambil alih sebagai host</button>
  </div>

  <div id="toast" role="status" hidden></div>
  <pre id="debug" hidden></pre>
  <div id="sfxtest" hidden></div>
  <div id="fatal" role="alert" hidden></div>

  <video id="keepAwake" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
    <source src="silence.webm" type="video/webm">
    <source src="silence.mp4" type="video/mp4">
  </video>

  <script type="module" src="js/game.js"></script>
</body>
</html>
